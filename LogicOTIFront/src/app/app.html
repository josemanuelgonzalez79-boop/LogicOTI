<p-toast position="top-right" />

<header class="app-header">
  <p-toolbar>
    <ng-template #start>
      <a routerLink="/" class="brand" aria-label="Ir al inicio">
        <span class="brand-mark"><i class="pi pi-bolt"></i></span>
        <span>
          <strong>Industrial App</strong>
          <small>Angular + Spring Boot</small>
        </span>
      </a>
    </ng-template>

    <ng-template #end>
      <p-button
        icon="pi pi-moon"
        [rounded]="true"
        [text]="true"
        ariaLabel="Alternar modo oscuro"
        (onClick)="toggleDarkMode()"
      />
    </ng-template>
  </p-toolbar>
</header>

<main class="app-content">
  <router-outlet />
</main>

<footer>Plantilla base · Java 21 · Spring Boot 4.1 · Angular 21 · PrimeNG 21</footer>
