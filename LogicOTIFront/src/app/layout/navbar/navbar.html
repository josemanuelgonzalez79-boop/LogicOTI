<header class="navbar">
  <div class="navbar__left">
    <button
      type="button"
      class="navbar__menu-button"
      aria-label="Abrir menú de navegación"
      (click)="openMobileMenu()"
    >
      <i class="pi pi-bars"></i>
    </button>

    <div class="navbar__brand">
      <span class="navbar__logo">
        <i class="pi pi-building"></i>
      </span>

      <div>
        <strong>Automatización OTI</strong>
        <small>Sistema de supervisión del edificio</small>
      </div>
    </div>
  </div>

  <div class="navbar__actions">
    <a
      routerLink="/alarms"
      class="navbar__alarm-button"
      [class.navbar__alarm-button--active]="activeAlarmCount() > 0"
      [attr.aria-label]="
        activeAlarmCount() > 0
          ? 'Revisar ' + activeAlarmCount() + ' alarmas activas'
          : 'No hay alarmas activas'
      "
      title="Abrir alarmas"
    >
      <i class="pi pi-bell"></i>

      @if (activeAlarmCount() > 0) {
        <span class="navbar__alarm-count">
          {{ activeAlarmCount() > 99 ? '99+' : activeAlarmCount() }}
        </span>
      }
    </a>

    <span class="navbar__status">
      <i class="pi pi-circle-fill"></i>
      Sistema en línea
    </span>

    <button type="button" class="navbar__user">
      <i class="pi pi-user"></i>
      <span>Daniel Ontiveros</span>
    </button>
  </div>
</header>
