<header class="navbar">
  <div class="navbar__left">
    <button
      type="button"
      class="navbar__menu-button"
      aria-label="Abrir menú de navegación"
      (click)="openMobileMenu()"
    >
      <i class="pi pi-bars"></i>
    </button>

    <div class="navbar__brand">
      <span class="navbar__logo">
        <i class="pi pi-building"></i>
      </span>

      <div>
        <strong>Automatización OTI</strong>
        <small>Sistema de supervisión del edificio</small>
      </div>
    </div>
  </div>

  <div class="navbar__actions">
    <button
      type="button"
      class="navbar__theme-button"
      [attr.aria-label]="darkMode() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
      [title]="darkMode() ? 'Tema claro' : 'Tema oscuro'"
      (click)="toggleTheme()"
    >
      <i class="pi" [class.pi-sun]="darkMode()" [class.pi-moon]="!darkMode()"></i>
    </button>

    <a
      routerLink="/alarms"
      class="navbar__alarm-button"
      [class.navbar__alarm-button--active]="activeAlarmCount() > 0"
      [attr.aria-label]="
        activeAlarmCount() > 0
          ? 'Revisar ' + activeAlarmCount() + ' alarmas activas'
          : 'No hay alarmas activas'
      "
      title="Abrir alarmas"
    >
      <i class="pi pi-bell"></i>

      @if (activeAlarmCount() > 0) {
        <span class="navbar__alarm-count">
          {{ activeAlarmCount() > 99 ? '99+' : activeAlarmCount() }}
        </span>
      }
    </a>

    <div class="navbar__user" aria-label="Usuario con sesión iniciada">
      <i class="pi pi-user"></i>
      <span>
        <strong>{{ currentUser?.fullName ?? 'Usuario' }}</strong>
        <small>{{ roleLabel(currentUser?.role) }}</small>
      </span>
    </div>

    <button type="button" class="navbar__logout" title="Cerrar sesión" (click)="logout()">
      <i class="pi pi-sign-out"></i>
      <span>Cerrar sesión</span>
    </button>
  </div>
</header>
