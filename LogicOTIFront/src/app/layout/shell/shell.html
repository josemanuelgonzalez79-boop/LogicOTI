<app-navbar
  (menuToggle)="openMobileMenu()"
/>

<div class="app-shell">
  <app-sidebar />

  <main class="app-shell__content">
    <router-outlet />
  </main>
</div>

<p-drawer
  [(visible)]="mobileMenuVisible"
  position="left"
  header="Navegación"
  [modal]="true"
  [dismissible]="true"
  [blockScroll]="true"
  styleClass="mobile-navigation-drawer"
>
  <app-sidebar
    (navigationSelected)="closeMobileMenu()"
  />
</p-drawer>
