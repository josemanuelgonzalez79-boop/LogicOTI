<header class="page-header">
  <div class="page-header__content">
    @if (icon()) {
      <i class="page-header__icon" [class]="icon()"></i>
    }

    <div>
      <h1 class="page-header__title">{{ title() }}</h1>

      @if (subtitle()) {
        <p class="page-header__subtitle">
          {{ subtitle() }}
        </p>
      }
    </div>
  </div>

  <div class="page-header__actions">
    <ng-content />
  </div>
</header>
