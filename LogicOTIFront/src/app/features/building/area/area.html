<section class="area-page">

    <a routerLink="/building">Edificio</a>
    <i class="pi pi-angle-right"></i>
    <a [routerLink]="['/building', 'floor', floorCode]">{{ floorCode }}</a>

  <app-control [compact]="true" [initialFloorCode]="floorCode" [initialAreaCode]="areaCode" />
