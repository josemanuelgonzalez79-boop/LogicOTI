<svg xmlns="http://www.w3.org/2000/svg"
     width="1700"
     height="548"
     viewBox="0 0 1700 548"
     role="img"
     aria-labelledby="p2-title p2-description">
  <title id="p2-title">Plano interactivo del Piso 2</title>
  <desc id="p2-description">
    Selecciona una zona marcada para abrir el estado de sus equipos y sensores.
  </desc>

  <style>
    .map-area { cursor: pointer; outline: none; }
    .area-shape {
      fill: #0f766e;
      fill-opacity: 0.08;
      stroke: #0f766e;
      stroke-width: 2;
      stroke-opacity: 0.7;
      vector-effect: non-scaling-stroke;
      transition: fill-opacity .18s ease, stroke-width .18s ease;
    }
    .area-label {
      fill: #0f172a;
      font: 700 15px Arial, sans-serif;
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .area-code {
      fill: #475569;
      font: 700 11px Arial, sans-serif;
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 3px;
    }
    .map-area:hover .area-shape,
    .map-area:focus .area-shape {
      fill-opacity: 0.22;
      stroke-width: 4;
    }
    .map-area[data-status="smoke"] .area-shape {
      fill: #dc2626;
      fill-opacity: 0.34;
      stroke: #b91c1c;
      stroke-width: 5;
    }
    .map-area[data-status="smoke"] .area-label,
    .map-area[data-status="smoke"] .area-code { fill: #991b1b; }
    .map-area[data-status="unknown"] .area-shape {
      fill: #64748b;
      fill-opacity: 0.06;
      stroke: #94a3b8;
      stroke-dasharray: 7 5;
    }
  </style>

  <image href="/assets/buildings/oti/levels/p2/plan.png"
         width="1700"
         height="548"
         preserveAspectRatio="none" />

  <g class="map-area" data-area-code="P2_A13" data-status="available" tabindex="0">
    <title>Pasillo · P2_A13</title>
    <rect class="area-shape" x="510" y="250" width="655" height="64" rx="8" />
    <text class="area-label" x="837" y="281">Pasillo</text>
    <text class="area-code" x="837" y="300">P2_A13</text>
  </g>

  <g class="map-area" data-area-code="P2_A01" data-status="available" tabindex="0">
    <title>Escalera trasera · P2_A01</title>
