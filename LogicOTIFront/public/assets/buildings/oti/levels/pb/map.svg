<svg xmlns="http://www.w3.org/2000/svg"
     width="1700"
     height="658"
     viewBox="0 0 1700 658"
     role="img"
     aria-labelledby="pb-title pb-description">
  <title id="pb-title">Plano interactivo de Planta Baja</title>
  <desc id="pb-description">
    Selecciona una zona marcada para abrir el estado de sus equipos y sensores.
  </desc>

  <style>
    .map-area { cursor: pointer; outline: none; }
    .area-shape {
      fill: #0f766e;
      fill-opacity: 0.08;
      stroke: #0f766e;
      stroke-width: 2;
      stroke-opacity: 0.75;
      vector-effect: non-scaling-stroke;
      transition: fill-opacity .18s ease, stroke-width .18s ease;
    }
    .area-label {
      fill: #0f172a;
      font: 700 16px Arial, sans-serif;
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .area-code {
      fill: #475569;
      font: 700 11px Arial, sans-serif;
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 3px;
    }
    .map-area:hover .area-shape,
    .map-area:focus .area-shape {
      fill-opacity: 0.22;
      stroke-width: 4;
    }
    .map-area[data-status="smoke"] .area-shape {
      fill: #dc2626;
      fill-opacity: 0.34;
      stroke: #b91c1c;
      stroke-width: 5;
    }
    .map-area[data-status="smoke"] .area-label,
    .map-area[data-status="smoke"] .area-code { fill: #991b1b; }
    .map-area[data-status="unknown"] .area-shape {
      fill: #64748b;
      fill-opacity: 0.06;
      stroke: #94a3b8;
      stroke-dasharray: 7 5;
    }
  </style>

  <image href="/assets/buildings/oti/levels/pb/plan.png"
         width="1700"
         height="658"
         preserveAspectRatio="none" />

  <g class="map-area" data-area-code="PB_A03" data-status="available" tabindex="0">
    <title>Área de carga y descarga · PB_A03</title>
    <path class="area-shape" d="M415 145L902 151V286H415Z" />
    <text class="area-label" x="660" y="205">Área de carga y descarga</text>
    <text class="area-code" x="660" y="227">PB_A03</text>
  </g>

  <g class="map-area" data-area-code="PB_A01" data-status="available" tabindex="0">
    <title>Recepción y sala de espera · PB_A01</title>
    <path class="area-shape" d="M420 287H680V397H900V489H420Z" />
    <text class="area-label" x="545" y="360">Recepción y sala de espera</text>
    <text class="area-code" x="545" y="382">PB_A01</text>
  </g>

  <g class="map-area" data-area-code="PB_A02" data-status="available" tabindex="0">
    <title>Comedor · PB_A02</title>
    <rect class="area-shape" x="680" y="287" width="220" height="110" rx="6" />
    <text class="area-label" x="790" y="335">Comedor</text>
    <text class="area-code" x="790" y="357">PB_A02</text>
  </g>

  <g class="map-area" data-area-code="PB_A04" data-status="available" tabindex="0">
    <title>Taller · PB_A04</title>
    <path class="area-shape" d="M902 151L1200 157V489H902Z" />
    <text class="area-label" x="1050" y="325">Taller</text>
    <text class="area-code" x="1050" y="347">PB_A04</text>
  </g>

  <g class="map-area" data-area-code="PB_A05" data-status="available" tabindex="0">
    <title>Almacén · PB_A05</title>
    <path class="area-shape" d="M1262 162L1607 176L1588 490H1262Z" />
    <text class="area-label" x="1435" y="326">Almacén</text>
    <text class="area-code" x="1435" y="348">PB_A05</text>
  </g>
</svg>
