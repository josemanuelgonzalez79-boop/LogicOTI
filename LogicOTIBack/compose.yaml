services:
  postgres:
    image: postgres:18-alpine
    container_name: industrial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: industrial_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - industrial_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d industrial_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  industrial_postgres_data:
