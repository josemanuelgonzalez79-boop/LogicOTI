spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:LogicOTIBack/.env[.properties]
  application:
    name: ${APP_NAME:industrial-backend-template}
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: logicoti-scheduler-

server:
  port: ${SERVER_PORT:3210}
  shutdown: graceful
  compression:
    enabled: true

app:
  allowed-origins:
    - ${FRONTEND_ORIGIN:http://localhost:8080}
    - ${FRONTEND_ORIGIN_ALT:http://127.0.0.1:8080}

plc:
  enabled: ${PLC_ENABLED:false}
  connection-string: ${PLC_CONNECTION_STRING:}
  timeout: ${PLC_TIMEOUT:5s}

signal:
  quality:
    stale-after: ${SIGNAL_STALE_AFTER:15s}

cameras:
  enabled: ${CAMERAS_ENABLED:false}
  playback-base-url: ${CAMERA_PLAYBACK_BASE_URL:}
  available-streams: ${CAMERA_AVAILABLE_STREAMS:}
  alert-link-expiration-seconds: ${CAMERA_ALERT_LINK_EXPIRATION_SECONDS:900}
  history:
    enabled: ${CAMERA_HISTORY_ENABLED:false}
    base-url: ${NVR_BASE_URL:}
    username: ${NVR_USERNAME:}
    password: ${NVR_PASSWORD:}
    time-zone: ${NVR_TIME_ZONE:America/Mazatlan}
    local-time-as-utc: ${NVR_LOCAL_TIME_AS_UTC:true}
    connect-timeout: ${NVR_CONNECT_TIMEOUT:5s}
    response-timeout: ${NVR_RESPONSE_TIMEOUT:15s}
    max-search-hours: ${NVR_MAX_SEARCH_HOURS:24}
    max-results: ${NVR_MAX_RESULTS:100}
    playback-enabled: ${CAMERA_HISTORY_PLAYBACK_ENABLED:false}
    media-mtx-control-url: ${MEDIAMTX_CONTROL_URL:}
    media-mtx-timeout: ${MEDIAMTX_CONTROL_TIMEOUT:5s}
    playback-session-ttl: ${CAMERA_HISTORY_PLAYBACK_SESSION_TTL:2h}
  ptz:
    enabled: ${CAMERA_PTZ_ENABLED:false}
    base-url: ${NVR_BASE_URL:}
    username: ${CAMERA_PTZ_USERNAME:${NVR_USERNAME:}}
    password: ${CAMERA_PTZ_PASSWORD:${NVR_PASSWORD:}}
    endpoint-mode: ${CAMERA_PTZ_ENDPOINT_MODE:direct}
    channels: ${CAMERA_PTZ_CHANNELS:25,26,27,28}
    speed: ${CAMERA_PTZ_SPEED:40}
    pulse-duration: ${CAMERA_PTZ_PULSE_DURATION:350ms}
    connect-timeout: ${CAMERA_PTZ_CONNECT_TIMEOUT:5s}
    response-timeout: ${CAMERA_PTZ_RESPONSE_TIMEOUT:5s}

notifications:
  web-push:
    enabled: ${WEB_PUSH_ENABLED:false}
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:mailto:soporte@icap.com.mx}
    max-attempts: ${WEB_PUSH_MAX_ATTEMPTS:4}
    initial-retry-delay-seconds: ${WEB_PUSH_INITIAL_RETRY_DELAY_SECONDS:30}
    retry-batch-size: ${WEB_PUSH_RETRY_BATCH_SIZE:100}
    retry-poll-ms: ${WEB_PUSH_RETRY_POLL_MS:5000}

history:
  retention:
    cron: ${HISTORY_RETENTION_CRON:0 30 3 * * *}
    scheduler-zone: ${HISTORY_RETENTION_SCHEDULER_ZONE:America/Mazatlan}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  two-factor:
    encryption-key: ${TWO_FACTOR_ENCRYPTION_KEY:${security.jwt.secret}}
    issuer: ${TWO_FACTOR_ISSUER:LogicOTI}
    challenge-expiration-seconds: ${TWO_FACTOR_CHALLENGE_EXPIRATION_SECONDS:300}
    challenge-max-attempts: ${TWO_FACTOR_CHALLENGE_MAX_ATTEMPTS:5}
    account-max-failures: ${TWO_FACTOR_ACCOUNT_MAX_FAILURES:10}
    account-lock-seconds: ${TWO_FACTOR_ACCOUNT_LOCK_SECONDS:900}
