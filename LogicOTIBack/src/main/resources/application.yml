spring:
  application:
    name: ${APP_NAME:industrial-backend-template}
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:3210}
  shutdown: graceful
  compression:
    enabled: true

app:
  allowed-origins:
    - ${FRONTEND_ORIGIN:http://localhost:4200}
    - ${FRONTEND_ORIGIN_ALT:http://127.0.0.1:4200}

plc:
  enabled: ${PLC_ENABLED:false}
  connection-string: ${PLC_CONNECTION_STRING:}
  timeout: ${PLC_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

security:
  jwt:
    secret: ${JWT_SECRET:LogicOTI-JWT-Secret-Key-2026-ICAP-Seguridad}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}